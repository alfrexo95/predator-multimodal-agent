name: Multimodal Agent
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Respaldo cada 2 horas
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run agent
        env:
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: python3 agent.py

      - name: Register Multimodal Agent in Predator Hub (optional)
        continue-on-error: true
        env:
          HUB_TOKEN: ${{ secrets.INFRA_HUB_TOKEN }}
          HUB_URL: https://x402-api-wigc.onrender.com
        run: |
          if [ -z "$HUB_TOKEN" ]; then echo "Hub registration skipped: token not configured"; exit 0; fi
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            hour="$(date -u +%H)"
            if (( 10#$hour % 6 != 0 )); then echo "Hub heartbeat skipped this cycle"; exit 0; fi
          fi
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"agent_id":"predator-multimodal-agent","platform":"github-actions","capabilities":["multimodal.analysis","media.processing","ucash.agent"]}' \
            "$HUB_URL/infra/agents/register"
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$HUB_URL/infra/agents/predator-multimodal-agent/heartbeat"
          # Read-only MCP catalog discovery; no paid endpoints are invoked.
          services_payload="{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"list_services\",\"arguments\":{}}}"
          routes_payload="{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"list_routes\",\"arguments\":{}}}"
          curl -fsS --max-time 20 -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" -d "$services_payload" "$HUB_URL/mcp" -o /tmp/hub-services.json
          curl -fsS --max-time 20 -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" -d "$routes_payload" "$HUB_URL/mcp" -o /tmp/hub-routes.json
          python3 - <<'PY'
          import json
          services=json.load(open("/tmp/hub-services.json"))["result"]["structuredContent"]["services"]
          routes=json.load(open("/tmp/hub-routes.json"))["result"]["structuredContent"]["routes"]
          print("MCP catalog discovery: %d services/workers, %d route definitions." % (len(services), len(routes)))
          PY
      - name: Commit deliveries
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add deliveries/ ucash_state.json || true
          git diff --cached --quiet || git commit -m "auto: delivery"
          git push
